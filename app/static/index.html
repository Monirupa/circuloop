<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircuLoop</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="13" fill="none" stroke="#F7B08A" stroke-width="3.5" stroke-dasharray="62 20" stroke-linecap="round"/>
        <path d="M27 6.5l1.8 6.2-6.4-.8z" fill="#F7B08A"/>
        <circle cx="17" cy="17" r="4" fill="#FDE9DC"/>
      </svg>
      <div><b>CircuLoop</b><small>Plant circularity</small></div>
    </div>
    <h3>Monitor</h3>
    <div id="nav"></div>
    <div class="foot">Advisory console. It recommends and explains; plant staff decide.<br>
      Data: Form V FY2021-22 and an open steel-plant energy dataset. <a data-view="records">Sources</a></div>
  </aside>

  <div class="main">
    <header class="top">
      <div><h1 id="ptitle">Plant overview</h1><p id="psub"></p></div>
      <div class="replay" aria-label="Reading controls">
        <button id="prev" title="Previous reading" aria-label="Previous reading">&#8249;</button>
        <button id="play" class="play">Pause</button>
        <button id="next" title="Next reading" aria-label="Next reading">&#8250;</button>
        <input type="range" id="slider" min="0" max="100" value="0" aria-label="Reading position">
        <div class="when"><b id="whenTime">-</b><span id="whenIdx"></span></div>
      </div>
    </header>
    <section class="band" id="band" aria-label="Plant statistics"></section>
    <main id="view"><div class="card">Loading...</div></main>
  </div>
</div>

<button class="fab" id="chatFab" aria-label="Open the question assistant">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  Ask CircuLoop
</button>
<aside class="chat" id="chat" hidden aria-label="Question assistant">
  <header><div><b>Ask CircuLoop</b><small>Answers from the values on this dashboard</small></div><button id="chatClose" aria-label="Close">&#10005;</button></header>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips"></div>
  <form id="chatForm"><input id="chatIn" autocomplete="off" placeholder="Ask about slag, energy or what to do..." aria-label="Your question"><button class="btn" type="submit">Send</button></form>
</aside>
<script src="/static/app.js"></script>
</body>
</html>
